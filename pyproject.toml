[project]
name = "jev-client"
version = "0.1.0"
description = "One-shot CLI for the TypeSafe Jev API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk",
    "typer>=0.12",
]

[project.scripts]
jev = "jev_client.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
